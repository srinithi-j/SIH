version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: sih-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: sih-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://sih_user:sih_password@postgres:5432/sih_portal
      JWT_SECRET: change_this_dev_secret_before_deploying
      JWT_EXPIRES_IN: 8h
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: sih-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "3000:3000"

volumes:
  pgdata:
